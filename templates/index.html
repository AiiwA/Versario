<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Versario - Generador de Poemas Audio</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🎵 Versario</h1>
            <p>Convierte tus poemas en audio con síntesis de voz</p>
        </header>

        <main>
            <!-- Formulario crear poema -->
            <section class="poem-form">
                <h2>Nuevo Poema</h2>
                <form id="poemForm" class="poem-form__form">
                    <div class="form-group">
                        <label for="titulo">Título:</label>
                        <input type="text" id="titulo" name="titulo" required 
                               placeholder="Ej: Mi Primer Poema">
                    </div>

                    <div class="form-group">
                        <label for="autor">Autor (opcional):</label>
                        <input type="text" id="autor" name="autor" 
                               placeholder="Tu nombre">
                    </div>

                    <div class="form-group">
                        <label for="texto">Texto del poema:</label>
                        <textarea id="texto" name="texto" rows="6" required 
                                  placeholder="Escribe tu poema aquí...&#10;&#10;Recuerda: Usa doble salto de línea (&#10;&#10;) para separar estrofas.&#10;Cada línea no vacía será un verso separado."
                                maxlength="10000"></textarea>
                        <small id="textoCounter" class="form-counter">0/10000 caracteres</small>
                    </div>

                    <div class="form-group">
                        <label for="velocidad">Velocidad:</label>
                        <input type="number" id="velocidad" name="velocidad" 
                               min="0.8" max="1.2" step="0.1" value="1.0" required>
                        <small>Nivel: normal</small>
                    </div>

                    <div class="form-group">
                        <label for="voz">Voz:</label>
                        <select id="voz" name="voz" required>
                            <!-- Se llena con JS -->
                        </select>
                    </div>

                    <button type="submit" class="btn btn-primary">Crear Poema</button>
                </form>
            </section>
        </main>

        <footer>
            <p>&copy; 2026 Versario - Generador de Poemas Audio con Piper TTS</p>
        </footer>
    </div>

    <script src="/static/js/app.js"></script>
</body>
</html>
